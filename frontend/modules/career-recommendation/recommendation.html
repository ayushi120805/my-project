<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Career Recommendation | CareerGuide</title>

    <link rel="stylesheet" href="../../style.css">

    <style>
        .recommendation-page {
            min-height: 100vh;
            padding: 120px 20px 70px;
            background: linear-gradient(135deg, #f5f7ff, #eef2ff);
        }

        .recommendation-container {
            max-width: 1050px;
            margin: auto;
        }

        .module-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .module-number {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 30px;
            background: #e0e7ff;
            color: #4f46e5;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .module-header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .module-header p {
            color: #64748b;
            font-size: 17px;
        }

        .progress-box {
            background: white;
            padding: 18px 22px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .progress-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .progress-bar {
            height: 9px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border-radius: 20px;
        }

        .welcome-card {
            background: white;
            padding: 28px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.07);
        }

        .welcome-card h2 {
            margin-bottom: 8px;
            color: #1e293b;
        }

        .welcome-card p {
            color: #64748b;
        }

        .recommendation-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .career-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.07);
            transition: 0.3s;
            border: 1px solid #eef2ff;
        }

        .career-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 40px rgba(79, 70, 229, 0.15);
        }

        .career-icon {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef2ff;
            border-radius: 15px;
            font-size: 27px;
            margin-bottom: 18px;
        }

        .career-card h3 {
            margin-bottom: 10px;
            color: #1e293b;
        }

        .career-card p {
            color: #64748b;
            line-height: 1.6;
            font-size: 14px;
        }

        .match-box {
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
        }

        .match-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .match-bar {
            height: 8px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
        }

        .match-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border-radius: 20px;
        }

        .reason {
            margin-top: 15px;
            font-size: 13px;
            color: #64748b;
            line-height: 1.5;
        }

        .next-btn {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            padding: 14px 25px;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            transition: 0.3s;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
        }

        #recommendationResult {
            min-height: 100px;
        }

        @media (max-width: 800px) {
            .recommendation-grid {
                grid-template-columns: 1fr;
            }

            .module-header h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="nav-container">

            <a href="../../index.html" class="logo">
                Career<span>Guide</span>
            </a>

            <div class="nav-links">
                <a href="../../index.html">Home</a>
                <a href="../../index.html#modules">Modules</a>
                <a href="../../index.html#about">About</a>
            </div>

        </div>

    </nav>


    <!-- PAGE -->
    <section class="recommendation-page">

        <div class="recommendation-container">

            <div class="module-header">

                <span class="module-number">
                    MODULE 03
                </span>

                <h1>Career Recommendation</h1>

                <p>
                    Your profile and assessment have been analyzed.
                    Here are your best career matches.
                </p>

            </div>


            <!-- PROGRESS -->
            <div class="progress-box">

                <div class="progress-top">
                    <span>Step 3 of 5</span>
                    <span>60% Complete</span>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>

            </div>


            <!-- RESULT -->
            <div id="recommendationResult">

                <p style="text-align:center;">
                    Analyzing your profile...
                </p>

            </div>

        </div>

    </section>


    <script src="recommendation.js"></script>

</body>

</html>
